version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpark_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smartpark.db
      - SECRET_KEY=fujiq-dx-smartpark-supersecret-jwt-key-2026-secure
      - ENVIRONMENT=production
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpark_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
